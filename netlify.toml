[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# Route /api/gemini to the Netlify function (nexus/api/gemini.mjs).
# The file is named gemini.mjs so the deployed URL is /.netlify/functions/gemini.
[functions]
directory = "nexus/api"
node_bundler = "esbuild"

[[redirects]]
from = "/api/gemini"
to = "/.netlify/functions/gemini"
status = 200
force = true

# SPA fallback: let React Router handle client-side routes like /snippets.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
