<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="NEXUS AI banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212F3C"/>
      <stop offset="0.62" stop-color="#24405C"/>
      <stop offset="1" stop-color="#2874A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#FF5733" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF5733" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5733"/>
      <stop offset="1" stop-color="#FF8A5C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- dotted grid texture -->
  <g fill="#EAEAEA" opacity="0.08">
    <circle cx="60" cy="240" r="2"/><circle cx="90" cy="240" r="2"/><circle cx="120" cy="240" r="2"/>
    <circle cx="60" cy="270" r="2"/><circle cx="90" cy="270" r="2"/><circle cx="120" cy="270" r="2"/>
    <circle cx="1050" cy="250" r="2"/><circle cx="1080" cy="250" r="2"/><circle cx="1110" cy="250" r="2"/><circle cx="1140" cy="250" r="2"/>
    <circle cx="1050" cy="280" r="2"/><circle cx="1080" cy="280" r="2"/><circle cx="1110" cy="280" r="2"/><circle cx="1140" cy="280" r="2"/>
  </g>

  <!-- code chip -->
  <g font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="15" opacity="0.9">
    <rect x="880" y="52" width="248" height="120" rx="12" fill="#16202B" stroke="#2874A6" stroke-opacity="0.6"/>
    <circle cx="902" cy="74" r="5" fill="#FF5733"/>
    <circle cx="920" cy="74" r="5" fill="#2874A6"/>
    <circle cx="938" cy="74" r="5" fill="#EAEAEA" opacity="0.5"/>
    <text x="898" y="104" fill="#7FB3D5">&lt;Workflow&gt;</text>
    <text x="912" y="128" fill="#EAEAEA">optimize();</text>
    <text x="912" y="152" fill="#FF8A5C">accelerate();</text>
  </g>

  <!-- wordmark -->
  <text x="72" y="128" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="78" fill="#FFFFFF" letter-spacing="2">NEXUS<tspan fill="#FF5733"> AI</tspan></text>
  <rect x="76" y="152" width="150" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="76" y="196" font-family="'Open Sans', 'Segoe UI', sans-serif" font-size="23" fill="#EAEAEA" letter-spacing="0.5">Optimize Workflow. Accelerate Learning. Empower Developers.</text>

  <!-- feature pills -->
  <g font-family="'Open Sans', 'Segoe UI', sans-serif" font-size="15" font-weight="600">
    <rect x="76" y="224" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#2874A6"/>
    <text x="151" y="246" fill="#EAEAEA" text-anchor="middle">AI Helper</text>
    <rect x="238" y="224" width="170" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#2874A6"/>
    <text x="323" y="246" fill="#EAEAEA" text-anchor="middle">Snippet Storage</text>
    <rect x="420" y="224" width="168" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#2874A6"/>
    <text x="504" y="246" fill="#EAEAEA" text-anchor="middle">Learning Tracker</text>
    <rect x="600" y="224" width="112" height="34" rx="17" fill="#FF5733"/>
    <text x="656" y="246" fill="#FFFFFF" text-anchor="middle">100% local</text>
  </g>
</svg>
